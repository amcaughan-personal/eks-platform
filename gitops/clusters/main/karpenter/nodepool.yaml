# The nodes Karpenter may launch for work that doesn't fit on the system nodes: spot first,
# on-demand when spot isn't available, Graviton or x86, small and medium general-purpose
# sizes. Empty or underused nodes are removed after five minutes, long enough that a run of
# short tasks reuses a node instead of waiting for a new one each time.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large", "xlarge"]
      expireAfter: 168h
  # A ceiling on what Karpenter can launch in total, so a runaway workload can't run up a bill.
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

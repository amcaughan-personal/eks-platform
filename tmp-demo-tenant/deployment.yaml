apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector: { matchLabels: { app: hello } }
  template:
    metadata: { labels: { app: hello } }
    spec:
      serviceAccountName: workers
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.10
